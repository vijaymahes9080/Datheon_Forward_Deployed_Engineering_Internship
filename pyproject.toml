[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisai-enterprise-gateway"
version = "1.0.0"
description = "Zero-Trust Enterprise AI Integration Engine"
authors = [{ name = "Forward Deployed Engineering", email = "fde@aegisai.internal" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "chromadb>=0.5.0",
    "pypdf>=4.3.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "rich>=13.7.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.ruff]
line-length = 100
target-version = "py312"
